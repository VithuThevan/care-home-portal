<div class="page">
  <div class="page-header"><div><h1>Reports</h1><p>Operational and financial reports with CSV, Excel and PDF export.</p></div></div>
  @if (errorMessage) { <div class="error-message">{{ errorMessage }}</div> }
  <div class="filters">
    <select [(ngModel)]="report">
      <option value="client-census">Client census</option>
      <option value="current-rates">Current rates</option>
      <option value="invoices-by-client">Invoices by client</option>
      <option value="invoices-by-care-home">Invoices by care home</option>
      <option value="income-by-category">Income by category</option>
      <option value="occupancy">Occupancy / availability</option>
      <option value="rate-history">Funding rate history</option>
      <option value="billing-exceptions">Billing exceptions</option>
      <option value="outstanding">Payment status / outstanding</option>
    </select>
    <input type="date" [(ngModel)]="from" />
    <input type="date" [(ngModel)]="to" />
    <button type="button" (click)="load()">Run</button>
    <button type="button" (click)="exportFormat('csv')">CSV</button>
    <button type="button" (click)="exportFormat('xlsx')">Excel</button>
    <button type="button" (click)="exportFormat('pdf')">PDF</button>
  </div>
  @if (rows.length) {
    <table>
      <thead><tr>@for (key of keys(); track key) { <th>{{ key }}</th> }</tr></thead>
      <tbody>
        @for (row of rows; track $index) {
          <tr>@for (key of keys(); track key) { <td>{{ row[key] }}</td> }</tr>
        }
      </tbody>
    </table>
  }
</div>
