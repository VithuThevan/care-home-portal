<div class="page">
  <div class="form-container">
    <h1>Organisation settings</h1>
    <p>These values apply to this organisation only. SMTP credentials stay in server configuration.</p>
    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }
    @if (savedMessage) {
      <p>{{ savedMessage }}</p>
    }
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-field"><label>Name</label><input formControlName="name" /></div>
      <div class="form-field"><label>Trading name</label><input formControlName="tradingName" /></div>
      <div class="form-field"><label>Registration number</label><input formControlName="registrationNumber" /></div>
      <div class="form-field"><label>Address</label><input formControlName="address" /></div>
      <div class="form-field"><label>Phone</label><input formControlName="phone" /></div>
      <div class="form-field"><label>Email</label><input formControlName="email" /></div>
      <div class="form-field"><label>Website</label><input formControlName="website" /></div>
      <div class="form-field"><label>Currency code</label><input formControlName="currencyCode" /></div>
      <div class="form-field"><label>Currency symbol</label><input formControlName="currencySymbol" /></div>
      <div class="form-field"><label>Time zone</label><input formControlName="timeZoneId" /></div>
      <div class="form-field"><label>Invoice prefix</label><input formControlName="invoicePrefix" /></div>
      <div class="form-field"><label>Credit note prefix</label><input formControlName="creditNotePrefix" /></div>
      <div class="form-field"><label>Number length</label><input type="number" formControlName="numberLength" /></div>
      <div class="form-field"><label>Payment terms (days)</label><input type="number" formControlName="paymentTermsDays" /></div>
      <div class="form-field"><label>Email from name</label><input formControlName="emailFromName" /></div>
      <div class="form-field"><label>Email from address</label><input formControlName="emailFromAddress" /></div>
      <div class="form-field"><label>Primary colour</label><input formControlName="primaryColour" /></div>
      <div class="buttons">
        <button class="primary-button" type="submit" [disabled]="isSaving">Save</button>
      </div>
    </form>
  </div>
</div>
