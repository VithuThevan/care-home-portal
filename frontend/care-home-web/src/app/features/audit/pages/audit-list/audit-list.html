<div class="page">
  <app-page-header title="Audit" subtitle="Append-only. Records cannot be edited." />
  <section class="panel mb-4 flex flex-wrap items-center gap-3">
    <mat-form-field appearance="outline">
      <mat-label>Entity type</mat-label>
      <input matInput [(ngModel)]="entityType" />
    </mat-form-field>
    <button mat-flat-button color="primary" type="button" (click)="load()">Filter</button>
  </section>
  <app-api-error [message]="errorMessage()" />
  @if (isLoading()) {
    <app-loading-state label="Loading audit log..." />
  }
  <p class="text-sm text-[var(--app-text-muted)]">{{ totalCount() }} events</p>
  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Entity</th>
          <th>Action</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.loggedAt }}</td>
            <td>{{ item.entityType }} {{ item.entityId }}</td>
            <td>{{ item.action }}</td>
            <td>{{ item.description }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
