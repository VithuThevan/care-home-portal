<div class="page">
  <div class="page-header"><div><h1>Audit Log</h1><p>Append-only. Records cannot be edited.</p></div></div>
  <div class="filters">
    <input placeholder="Entity type" [(ngModel)]="entityType" />
    <button type="button" (click)="load()">Filter</button>
  </div>
  <p>{{ totalCount }} events</p>
  <table>
    <thead><tr><th>When</th><th>Entity</th><th>Action</th><th>Description</th></tr></thead>
    <tbody>
      @for (item of items; track item.id) {
        <tr>
          <td>{{ item.loggedAt }}</td>
          <td>{{ item.entityType }} {{ item.entityId }}</td>
          <td>{{ item.action }}</td>
          <td>{{ item.description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
